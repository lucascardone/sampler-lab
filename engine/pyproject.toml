[project]
name = "sampler-engine"
version = "0.1.0"
description = "Motor local de Sampler Lab: separación de instrumentos (stems) con Demucs."
license = "GPL-3.0-or-later"
authors = [{ name = "Lucas Cardone" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "numpy>=1.26",
    "soundfile>=0.12",
    "psutil>=5.9",
    # Maintained fork by the original author (github.com/adefossez/demucs). Code MIT;
    # model weights have an unclear license (see docs/MODELS.md).
    # 4.1 no longer needs torchaudio for inference.
    "demucs>=4.1,<5",
    # torch comes from one of the groups below (cpu / cu126 / cu130), picked per machine.
]

[project.scripts]
sampler-engine = "sampler_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# PyTorch build, one per machine (the app picks it: NVIDIA driver >= 580 -> cu130,
# older NVIDIA driver -> cu126, no NVIDIA card -> cpu). Intel Macs top out at torch 2.2.
cpu = ["torch>=2.1,<2.15"]
cu126 = ["torch>=2.1,<2.15"]
cu130 = ["torch>=2.1,<2.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sampler_engine"]

[tool.uv]
# Development (`uv sync`, `uv run pytest`) keeps the CUDA 13 build, as before. The app
# installs with `--no-default-groups --group <variant>`.
default-groups = ["dev", "cu130"]
conflicts = [[{ group = "cpu" }, { group = "cu126" }, { group = "cu130" }]]

# macOS uses the default PyPI wheel (supports Apple's MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", group = "cu126", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real Demucs model (downloads weights)"]
addopts = "-m 'not slow'"
